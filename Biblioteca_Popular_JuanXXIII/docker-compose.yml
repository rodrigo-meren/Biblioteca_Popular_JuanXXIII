services:
  web:
    build: .
    ports:
      - "5000:8080" # Expone la app al puerto 80 (el puerto web oficial)
    environment:
      # Sobreescribe el appsettings.json para conectar a la DB de Docker
      - ConnectionStrings__DefaultConnection=Host=db;Database=BibliotecaJuanXXIII;Username=postgres;Password=Manteca1
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=BibliotecaJuanXXIII
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Manteca1
    volumes:
      - pgdata:/var/lib/postgresql/data # Guarda los datos para que no se borren si el server se reinicia

volumes:
  pgdata: